server:
  port: 8080
  servlet:
    context-path: /api/v1/

spring:
    application:
      name: order_service

    datasource:
      url: jdbc:postgresql://localhost:5432/postgres
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update

    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest

discount:
  service:
    url: http://localhost:8081/api/v1/getDiscount

rabbitmq:
    name: message.direct
