server:
  port: 8080
  servlet:
    context-path: /api/v1/

spring:
    application:
      name: order-service

    datasource:
      url: jdbc:postgresql://localhost:5433/postgres
      username: postgres
      password: admin
      driver-class-name: org.postgresql.Driver
    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update

    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest

    cloud:
      zookeeper:
        connect-string: localhost:2181
        discovery:
          enabled: true
          instance-id: ${spring.application.name}:${random.value}
          register: true

discount:
  service:
    url: http://localhost:8081

rabbitmq:
    excName: orderCreate
    qName: message.queue
    queue_with_auto_ack: queue_with_auto_ack
    queue_without_auto_ack: queue_without_auto_ack

