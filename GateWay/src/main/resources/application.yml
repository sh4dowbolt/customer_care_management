server:
  port: 8083
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order-service/**
          filters:
            - RewritePath=/order-service/(?<segment>.*), /api/v1/$\{segment}
        - id: discount-service
          uri: lb://discount-service
          predicates:
            - Path=/discount-service/**
          filters:
            - RewritePath=/discount-service/(?<segment>.*), /api/v1/$\{segment}
